name: Android Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Build an unsigned release APK. This validates the app without relying on
    # personal signing secrets or generating a corrupt keystore from empty values.
    - name: Build Prod Release APK
      run: ./gradlew :app:assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: astral-music-test-apk
        path: app/build/outputs/apk/prod/release/*.apk
        if-no-files-found: error
