name: Android Installable APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-installable-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Debug APKs are signed automatically with Android's debug key so they can
    # be installed for testing without private release-signing secrets.
    - name: Build installable Prod Debug APK
      run: ./gradlew :app:assembleProdDebug

    - name: Upload installable APK
      uses: actions/upload-artifact@v4
      with:
        name: astral-song-installable-apk
        path: app/build/outputs/apk/prod/debug/*.apk
        if-no-files-found: error
